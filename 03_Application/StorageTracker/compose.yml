services:
  storagetracker:
    build:
      context: ../..
      dockerfile: 03_Application/StorageTracker/Dockerfile
    container_name: atlas-storagetracker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8022:8000"
    environment:
      ATLAS_PG_DB:       ${ATLAS_PG_DB}
      ATLAS_PG_USER:     ${ATLAS_PG_USER}
      ATLAS_PG_PASSWORD: ${ATLAS_PG_PASSWORD}
      ATLAS_PG_PORT:     ${ATLAS_PG_PORT}
      ATLAS_PG_HOST:     atlas-postgres
    volumes:
      - ${DATA_ROOT}/storagetracker/logs:/app/logs
    networks:
      - atlas-net

networks:
  atlas-net:
    external: true
