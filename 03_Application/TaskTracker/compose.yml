services:
  tasktracker:
    build:
      context: ../..
      dockerfile: 03_Application/TaskTracker/Dockerfile
    container_name: atlas-tasktracker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      ATLAS_PG_DB:       ${ATLAS_PG_DB}
      ATLAS_PG_USER:     ${ATLAS_PG_USER}
      ATLAS_PG_PASSWORD: ${ATLAS_PG_PASSWORD}
      ATLAS_PG_PORT:     ${ATLAS_PG_PORT}
      ATLAS_PG_HOST:     atlas-postgres
      LABEL_ENGINE_URL:      http://atlas-label-engine:8000
      PREFERENCE_STORE_URL:  http://atlas-preference-store:8000
    volumes:
      - ${DATA_ROOT}/tasktracker/logs:/app/logs
    networks:
      - atlas-net

networks:
  atlas-net:
    external: true
