services:
  numericseries:
    build:
      context: ../..
      dockerfile: 03_Application/NumericSeries/Dockerfile
    container_name: atlas-numeric-series
    restart: unless-stopped
    ports:
      - "127.0.0.1:8014:8000"
    environment:
      ATLAS_PG_DB:       ${ATLAS_PG_DB}
      ATLAS_PG_USER:     ${ATLAS_PG_USER}
      ATLAS_PG_PASSWORD: ${ATLAS_PG_PASSWORD}
      ATLAS_PG_PORT:     ${ATLAS_PG_PORT}
      ATLAS_PG_HOST:     atlas-postgres
      LABEL_ENGINE_URL:  http://atlas-label-engine:8000
    volumes:
      - ${DATA_ROOT}/numericseries/logs:/app/logs
    networks:
      - atlas-net

networks:
  atlas-net:
    external: true
