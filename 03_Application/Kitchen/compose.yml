services:
  kitchen:
    build:
      context: ../..
      dockerfile: 03_Application/Kitchen/Dockerfile
    container_name: atlas-kitchen
    restart: unless-stopped
    ports:
      - "127.0.0.1:8028:8000"
    environment:
      ATLAS_PG_DB:       ${ATLAS_PG_DB}
      ATLAS_PG_USER:     ${ATLAS_PG_USER}
      ATLAS_PG_PASSWORD: ${ATLAS_PG_PASSWORD}
      ATLAS_PG_PORT:     ${ATLAS_PG_PORT}
      ATLAS_PG_HOST:     atlas-postgres
      ATLAS_SERVICE_TOKEN: ${ATLAS_SERVICE_TOKEN}
      STORAGETRACKER_URL: http://atlas-storagetracker:8000
    volumes:
      - ${DATA_ROOT}/kitchen/logs:/app/logs
    networks:
      - atlas-net

  kitchen-test:
    container_name: atlas-kitchen-test
    build:
      context: ../..
      dockerfile: 03_Application/Kitchen/Dockerfile
    environment:
      ATLAS_PG_DB:       atlas_test
      ATLAS_PG_USER:     ${ATLAS_PG_USER}
      ATLAS_PG_PASSWORD: ${ATLAS_PG_PASSWORD}
      ATLAS_PG_PORT:     ${ATLAS_PG_PORT}
      ATLAS_PG_HOST:     atlas-postgres
      ATLAS_SERVICE_TOKEN: ${ATLAS_SERVICE_TOKEN}
    command: ["sleep", "infinity"]
    networks:
      - atlas-net

networks:
  atlas-net:
    external: true
