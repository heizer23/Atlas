server {
    listen 80;

    # Single shared password instead of Cloudflare Access/OAuth — this site
    # is meant to be reachable by family members without a Google account.
    auth_basic           "Familienatlas";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /assets/ {
        alias /var/familyatlas-images/;
    }

    location / {
        root       /usr/share/nginx/html;
        try_files  $uri $uri/ =404;
    }
}
