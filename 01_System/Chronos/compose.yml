services:
  chronos:
    image: ${CHRONOS_IMAGE}
    container_name: atlas-chronos
    restart: unless-stopped
    ports:
      - "${CHRONOS_BIND}:${CHRONOS_PORT}:18789"
    environment:
      OPENCLAW_ALLOWED_ORIGINS: ${CHRONOS_ALLOWED_ORIGINS}
      ANTHROPIC_API_KEY: ${OPENCLAW_API}
      TELEGRAM_BOT_TOKEN: ${TeleAtlasBotToken}
      OPENAI_API_KEY: ${WhisperKey}
    volumes:
      - "${CHRONOS_STATE_DIR}:/home/node/.openclaw"
      - "${CHRONOS_WORKSPACE_DIR}:/workspace"
      - "${CHRONOS_PATCHES_DIR}/lib/web/fetch/body.js:/app/node_modules/undici/lib/web/fetch/body.js:ro"
      - "${CHRONOS_PATCHES_DIR}/lib/web/fetch/response.js:/app/node_modules/undici/lib/web/fetch/response.js:ro"
    networks:
      - atlas-net

networks:
  atlas-net:
    external: true
