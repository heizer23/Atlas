# Atlas Test Stack
#
# Mirrors the prod stack against atlas_test database.
# All service URLs point to *-test containers.
# No log volumes — tests don't need persistence.
#
# Start:  make -C 01_System test-up
# Stop:   make -C 01_System test-down
# Status: make -C 01_System test-ps
# Sync:   make -C 01_System test-sync-db   (prod → atlas_test, for exploratory testing)
# Run:    make -C 01_System test-run COMPONENT=storagetracker

networks:
  atlas-net:
    external: true

services:

  # ── Platform ──────────────────────────────────────────────────────────────────

  label-engine-test:
    build:
      context: ../..
      dockerfile: 02_Platform/LabelEngine/Dockerfile
    container_name: atlas-label-engine-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:9050:8000"
    environment:
      ATLAS_PG_DB:       atlas_test
      ATLAS_PG_USER:     ${ATLAS_PG_USER}
      ATLAS_PG_PASSWORD: ${ATLAS_PG_PASSWORD}
      ATLAS_PG_PORT:     ${ATLAS_PG_PORT}
      ATLAS_PG_HOST:     atlas-postgres
    networks:
      - atlas-net

  preference-store-test:
