server {
    listen 80;

    # WorkoutTracker API — longer prefix wins
    location /api/workout {
        proxy_pass         http://atlas-workout-tracker:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # TaskTracker API
    location /api/tasks {
        proxy_pass         http://atlas-tasktracker:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Static shell SPA — fallback to index.html for client-side routing
    location / {
        root       /usr/share/nginx/html;
        try_files  $uri $uri/ /index.html;
    }
}
