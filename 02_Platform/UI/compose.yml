services:
  atlas-ui:
    container_name: atlas-ui
    build:
      context: ../..
      dockerfile: 02_Platform/UI/Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"    # Accessible over Tailscale; no auth bypass since Tailscale controls access
    networks:
      - atlas-net

networks:
  atlas-net:
    external: true
