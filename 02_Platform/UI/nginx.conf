server {
    listen 80;

    # WorkoutTracker — must come before the generic /api/ block (longer prefix wins)
    location /api/workout {
        proxy_pass         http://atlas-workout-tracker:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # TaskTracker — catches all remaining /api/ paths
    location /api {
        proxy_pass         http://atlas-tasktracker:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Static React app — SPA fallback to index.html
    location / {
        root       /usr/share/nginx/html;
        try_files  $uri $uri/ /index.html;
    }
}
