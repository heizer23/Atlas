<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- AtlasPhone native bridge: capture the MessagePort the TWA host delivers (see platform-ui/mobile).
         Runs before the app boots so a port delivered at page load is never missed. Only ports sent by
         the AtlasPhone app origin are accepted; in a normal browser nothing ever arrives. -->
    <script>
      (function () {
        var native = (window.__atlasNative = { port: null, onPort: null, log: [] });
        window.addEventListener('message', function (e) {
          if (!e.ports || !e.ports.length) return;
          native.log.push(new Date().toISOString() + ' port from ' + e.origin);
          if (e.origin.indexOf('android-app://net.linspad.atlasphone') !== 0) return;
          native.port = e.ports[0];
          if (native.onPort) native.onPort(native.port);
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/shell/main.tsx"></script>
  </body>
</html>
