<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- AtlasPhone native bridge endpoint (see platform-ui/mobile). AtlasPhone launches the TWA with
         "#bridge=<port>.<token>". Read it before the app boots, keep it for reloads of this tab only
         (sessionStorage) and strip it from the address bar. In a normal browser there is no fragment
         and no stored value, so nothing ever connects. -->
    <script>
      (function () {
        var native = (window.__atlasNative = { endpoint: null, port: null, onPort: null, log: [] });
        var RE = /^(\d{1,5})\.([A-Za-z0-9_-]{20,128})$/;
        function parse(raw) {
          var m = raw && RE.exec(raw);
          return m ? { port: parseInt(m[1], 10), token: m[2] } : null;
        }
        try {
          var h = /(?:^#|&)bridge=([^&]+)/.exec(location.hash);
          var raw = h ? h[1] : sessionStorage.getItem('atlas.bridge');
          var ep = parse(raw);
          if (ep) {
            sessionStorage.setItem('atlas.bridge', raw);
            native.endpoint = ep;
          }
          if (h) history.replaceState(history.state, '', location.pathname + location.search);
        } catch (e) { /* storage blocked: bridge simply unavailable */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/shell/main.tsx"></script>
  </body>
</html>
