server {
    listen 80;

    # Use Docker's internal DNS resolver with lazy resolution.
    # Variables in proxy_pass force per-request DNS lookup instead of
    # startup-time resolution — nginx starts even if a backend is down.
    resolver 127.0.0.11 valid=5s;

    # WorkoutTracker API — longer prefix wins
    location /api/workout {
        set $upstream_workout atlas-workout-tracker:8000;
        proxy_pass         http://$upstream_workout;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # FoodTracker API
    location /api/food {
        set $upstream_food atlas-food-tracker:8000;
        proxy_pass         http://$upstream_food;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Chronicle API
    location /api/chronicle {
        set $upstream_chronicle atlas-chronicle:8000;
        proxy_pass         http://$upstream_chronicle;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # TaskTracker API
    location /api/tasks {
        set $upstream_tasks atlas-tasktracker:8000;
        proxy_pass         http://$upstream_tasks;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # CalendarConnector platform API
    location /api/calendar {
        set $upstream_calendar atlas-calendar-connector:8000;
        proxy_pass         http://$upstream_calendar;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Notifications platform API
    location /api/notifications {
        set $upstream_notifications atlas-notifications:8000;
        proxy_pass         http://$upstream_notifications;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /api/devices {
        set $upstream_notifications atlas-notifications:8000;
        proxy_pass         http://$upstream_notifications;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # NumericSeries API
    location /api/series {
        set $upstream_numeric atlas-numeric-series:8000;
        proxy_pass         http://$upstream_numeric;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /api/batch {
        set $upstream_numeric atlas-numeric-series:8000;
        proxy_pass         http://$upstream_numeric;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # LinkingEngine platform API
    location /api/linking {
        set $upstream_linking atlas-linking-engine:8000;
        proxy_pass         http://$upstream_linking;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Calendar application API
    location /api/cal {
        set $upstream_calendar_app atlas-calendar:8000;
        proxy_pass         http://$upstream_calendar_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # StorageTracker API
    location /api/items {
        set $upstream_storage atlas-storagetracker:8000;
        proxy_pass         http://$upstream_storage;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /api/shopping-tasks {
        set $upstream_storage atlas-storagetracker:8000;
        proxy_pass         http://$upstream_storage;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # EssayCards API
    location /api/essaycards {
        set $upstream_essaycards atlas-essaycards:8000;
        proxy_pass         http://$upstream_essaycards;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Content-hashed build assets (filename changes whenever content changes) —
    # safe to cache aggressively; a stale cached copy simply can't exist because
    # a new build never reuses the same filename.
    location /assets/ {
        root       /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is NOT content-hashed and is what points the browser at the
    # current build's hashed asset filenames — it must never be cached, or a
    # browser can keep serving an old index.html that references old (but
    # still-present, since deploys never delete stale assets) JS/CSS forever,
    # silently masking every subsequent deploy.
    location = /index.html {
        root       /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Static shell SPA — fallback to index.html for client-side routing
    location / {
        root       /usr/share/nginx/html;
        try_files  $uri $uri/ /index.html;
    }
}
